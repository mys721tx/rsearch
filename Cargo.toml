[package]
name = "rsearch"
version = "0.1.0"
edition = "2024"
authors = ["Yishen Miao <mys721tx@gmail.com>"]

[dependencies]
bio = "4.2.2"
clap = "4.6.8"
md-5 = "0.11.0"
mimalloc = "0.1.52"
sha1 = "0.11.0"

[lib]
name = "rsearch"
path = "src/lib/lib.rs"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "conv"
harness = false

[[bench]]
name = "derep"
harness = false

[[bench]]
name = "relab"
harness = false

[[bench]]
name = "sqtrim"
harness = false

[[bench]]
name = "sqfilt"
harness = false
